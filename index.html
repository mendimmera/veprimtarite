<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ditari i veprimtarive</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--ac:#2a6df4;--bd:#dfe3ea;--dg:#d92d20}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf0;--mut:#98a2b3;--ac:#5b8def;--bd:#2c3340;--dg:#f97066}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--dg);padding:4px 8px}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pv,.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pv img,.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;cursor:pointer}
.it{border-top:1px solid var(--bd);padding:12px 0}
.it:first-child{border-top:0}
.m{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78rem}
.dt{color:var(--mut);font-size:.85rem}
.er{color:var(--dg);font-size:.9rem;margin-top:8px}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:95%;max-height:95%}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
<header><h1>📋 Ditari i veprimtarive</h1><button id="out" class="s hide">Dil</button></header>

<!-- Hyrja -->
<div id="auth" class="c">
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Fjalëkalimi (min. 6 shenja)</label><input id="pw" type="password" autocomplete="current-password">
  <div class="r"><button id="li">Hyr</button><button id="su" class="s">Krijo llogari</button></div>
  <div id="aer" class="er"></div>
</div>

<div id="app" class="hide">
  <!-- Shto veprimtari -->
  <div class="c">
    <b>Veprimtari e re</b>
    <label>Data</label><input id="d" type="date">
    <label>Lloji (zgjidh nga lista ose shkruaj një të ri)</label>
    <input id="ty" list="tl" placeholder="p.sh. Mbledhje, Vizitë, Trajnim">
    <datalist id="tl"></datalist>
    <label>Përshkrimi i shkurtër</label><textarea id="ds"></textarea>
    <div class="r">
      <button class="s" onclick="document.getElementById('fg').click()">🖼️ Ngarko foto</button>
      <button class="s" onclick="document.getElementById('fc').click()">📷 Bëj foto</button>
    </div>
    <input id="fg" type="file" accept="image/*" multiple class="hide">
    <input id="fc" type="file" accept="image/*" capture="environment" class="hide">
    <div id="pv" class="pv"></div>
    <div class="r"><button id="sv">Ruaj</button><button id="cn" class="s hide">Anulo</button></div>
    <div id="er" class="er"></div>
  </div>

  <!-- Kërko -->
  <div class="c">
    <label style="margin-top:0">Shfaq veprimtaritë e llojit:</label>
    <select id="fl"></select>
    <label>Kërko në përshkrim</label><input id="q" type="search" placeholder="fjalë kyçe">
    <div class="r"><div style="flex:1"><label style="margin-top:0">Nga data</label><input id="df" type="date"></div><div style="flex:1"><label style="margin-top:0">Deri në datë</label><input id="dt2" type="date"></div></div>
    <div class="r"><button id="cl" class="s">Pastro filtrat</button></div>
    <div id="ls" style="margin-top:8px"></div>
  </div>
</div>
</div>
<div id="lb"><img id="lbi" alt=""></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// === ZëVENDËSO me të dhënat e projektit tënd Firebase ===
const firebaseConfig = {
  apiKey: "AIzaSyBOtjHeq635jNofyj-NuU4mgyzFOqympiQ",
  authDomain: "veprimtarite-87886.firebaseapp.com",
  projectId: "veprimtarite-87886",
  storageBucket: "veprimtarite-87886.firebasestorage.app",
  messagingSenderId: "959208667358",
  appId: "1:959208667358:web:f85325481868f432e5aa4f",
  measurementId: "G-2RK3Q75YSP"
};
// =========================================================
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
let uid = null, items = [], photos = [], editId = null;

const today = () => new Date().toISOString().slice(0, 10);
const fmt = s => s.split('-').reverse().join('.');

// ---- Hyrja ----
const authErr = e => $('aer').textContent = 'Gabim: ' + e.message;
$('li').onclick = () => auth.signInWithEmailAndPassword($('em').value, $('pw').value).catch(authErr);
$('su').onclick = () => auth.createUserWithEmailAndPassword($('em').value, $('pw').value).catch(authErr);
$('out').onclick = () => auth.signOut();

auth.onAuthStateChanged(u => {
  uid = u ? u.uid : null;
  $('auth').classList.toggle('hide', !!u);
  $('app').classList.toggle('hide', !u);
  $('out').classList.toggle('hide', !u);
  if (u) { $('d').value = today(); load(); }
});

// ---- Foto: ngjeshje para ruajtjes ----
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.65));
    };
    img.onerror = rej;
    img.src = url;
  });
}
async function addFiles(e) {
  for (const f of e.target.files) {
    if (photos.length >= 4) { $('er').textContent = 'Maksimumi 4 foto për veprimtari.'; break; }
    try { photos.push(await compress(f)); } catch (_) {}
  }
  e.target.value = '';
  renderPv();
}
$('fg').onchange = addFiles; $('fc').onchange = addFiles;
function renderPv() {
  $('pv').innerHTML = '';
  photos.forEach((p, i) => {
    const im = document.createElement('img'); im.src = p;
    im.title = 'Kliko për ta hequr';
    im.onclick = () => { photos.splice(i, 1); renderPv(); };
    $('pv').appendChild(im);
  });
}

// ---- Ruaj / Ndrysho ----
function resetForm() {
  editId = null; $('ty').value = ''; $('ds').value = ''; $('d').value = today();
  photos = []; renderPv(); $('sv').textContent = 'Ruaj'; $('cn').classList.add('hide'); $('er').textContent = '';
}
$('cn').onclick = resetForm;
function startEdit(i) {
  editId = i.id; $('d').value = i.date; $('ty').value = i.type; $('ds').value = i.desc || '';
  photos = (i.photos || []).slice(); renderPv();
  $('sv').textContent = 'Përditëso'; $('cn').classList.remove('hide');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('sv').onclick = async () => {
  const type = $('ty').value.trim(), desc = $('ds').value.trim(), date = $('d').value;
  $('er').textContent = '';
  if (!date || !type) { $('er').textContent = 'Plotëso datën dhe llojin.'; return; }
  const doc = { date, type, desc, photos, created: Date.now() };
  if (JSON.stringify(doc).length > 950000) { $('er').textContent = 'Fotot janë shumë të mëdha; hiq një foto.'; return; }
  $('sv').disabled = true;
  try {
    const col = db.collection('users').doc(uid).collection('activities');
    if (editId) { delete doc.created; await col.doc(editId).update(doc); } else await col.add(doc);
    resetForm();
    await load();
  } catch (e) { $('er').textContent = 'Gabim në ruajtje: ' + e.message; }
  $('sv').disabled = false;
};

// ---- Ngarko, filtro, shfaq ----
async function load() {
  const s = await db.collection('users').doc(uid).collection('activities').orderBy('date', 'desc').get();
  items = s.docs.map(d => ({ id: d.id, ...d.data() }));
  const types = [...new Set(items.map(i => i.type))].sort((a, b) => a.localeCompare(b));
  const cur = $('fl').value;
  $('fl').innerHTML = '<option value="">Të gjitha llojet</option>' + types.map(t => `<option>${esc(t)}</option>`).join('');
  $('fl').value = types.includes(cur) ? cur : '';
  $('tl').innerHTML = types.map(t => `<option value="${esc(t)}">`).join('');
  render();
}
['fl', 'q', 'df', 'dt2'].forEach(id => { $(id).oninput = render; });
$('fl').onchange = render;
$('cl').onclick = () => { $('fl').value = ''; $('q').value = ''; $('df').value = ''; $('dt2').value = ''; render(); };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const f = $('fl').value, q = $('q').value.trim().toLowerCase(), a = $('df').value, b = $('dt2').value;
  const list = items.filter(i => (!f || i.type === f) && (!q || (i.desc || '').toLowerCase().includes(q) || i.type.toLowerCase().includes(q)) && (!a || i.date >= a) && (!b || i.date <= b));
  const box = $('ls'); box.innerHTML = `<p class="dt" style="margin:0 0 4px">${list.length} veprimtari</p>`;
  if (!list.length) { box.innerHTML = '<p class="dt">Asnjë veprimtari.</p>'; return; }
  list.forEach(i => {
    const el = document.createElement('div'); el.className = 'it';
    el.innerHTML = `<div class="m"><div><span class="t">${esc(i.type)}</span> <span class="dt">${fmt(i.date)}</span></div><span><button class="d ed" style="color:var(--ac)">Ndrysho</button><button class="d dl">Fshi</button></span></div><p>${esc(i.desc || '')}</p><div class="ph"></div>`;
    (i.photos || []).forEach(p => {
      const im = document.createElement('img'); im.src = p;
      im.onclick = () => { $('lbi').src = p; $('lb').style.display = 'flex'; };
      el.querySelector('.ph').appendChild(im);
    });
    el.querySelector('.ed').onclick = () => startEdit(i);
    el.querySelector('.dl').onclick = async () => {
      if (!confirm('Ta fshij këtë veprimtari?')) return;
      await db.collection('users').doc(uid).collection('activities').doc(i.id).delete();
      load();
    };
    box.appendChild(el);
  });
}
$('lb').onclick = () => $('lb').style.display = 'none';
</script>
</body>
</html>
